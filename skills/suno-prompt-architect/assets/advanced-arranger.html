    el('load').onclick=()=>{state.blocks=PRESETS[Number(el('preset').value)].map(t=>makeBlock(t,++uid));selected=state.blocks[0].id;render();save();message('replaced');};
    el('copy').onclick=async()=>{try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(el('output').value);message('copied');}catch{el('output').focus();el('output').select();message('manual');}};
    el('copy-style').onclick=async()=>{try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(el('style').value);el('style-status').textContent=text().styleCopied;}catch{el('style').focus();el('style').select();el('style-status').textContent=text().manual;}};
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
    root.arranger={snapshot:()=>JSON.parse(JSON.stringify(state)),valid,load:value=>{if(!valid(value))return false;restore({modelContent:{arranger:value}});render();save();return true;}};
    render();
  })();
  </script>
  <script>
  (()=>{
    const root=document.getElementById('suno-arranger-ui'),api=root.arranger,q=id=>root.querySelector('#sa-'+id);
    const I18N={
      fr:{projects:'Mes projets',name:'Nom du projet',save:'Enregistrer',duplicate:'Dupliquer',open:'Ouvrir',compare:'Comparer',export:'Exporter le projet',import:'Importer un projet',empty:'Aucun projet enregistré',saved:'Projet enregistré dans ce navigateur.',session:'Stockage indisponible : projet gardé pour cette session. Exportez-le pour le conserver.',note:'Sauvegarde locale à ce navigateur. Un fichier exporté permet de changer d’appareil.',opened:'Projet ouvert.',bad:'Fichier non reconnu ou trop volumineux. Le projet courant reste intact.',full:'20 projets maximum. Exportez une copie pour la conserver.',copied:' — copie',compose:'Composer la description',apply:'Appliquer ces choix',undo:'Annuler',replace:'Remplace la description actuelle ; les sections restent intactes.',genre:'Style musical',mood:'Ambiance',texture:'Couleur du son',speed:'Rythme',genres:['Funk','Soul','Jazz','Rock','Électronique','Ambiance'],moods:['Joyeuse','Mystérieuse','Détendue','Épique'],textures:['Chaleur vintage','Clair et moderne','Acoustique et naturel'],speeds:['Tranquille','Entraînant','Très énergique'],instruments:['Basse','Guitare','Piano','Cuivres','Synthés','Batterie'],voice:'La description demande une voix alors que Lyrics est instrumental.',loop:'La description demande un grand final mais une section prévoit une boucle.',ending:'Une fin est suivie d’autres sections : vérifiez le déroulé.',same:'Cette version est identique au projet sélectionné.',different:'Comparaison : ',style:'description différente',blocks:'déroulé différent',exported:'Fichier de projet préparé.',imported:'Projet importé. Enregistrez-le pour le garder ici.'},
      en:{projects:'My projects',name:'Project name',save:'Save',duplicate:'Duplicate',open:'Open',compare:'Compare',export:'Export project',import:'Import project',empty:'No saved projects',saved:'Project saved in this browser.',session:'Storage unavailable: project kept for this session. Export it to keep it.',note:'Saved locally in this browser. Export a file to move between devices.',opened:'Project opened.',bad:'Unknown or oversized file. Your current project is unchanged.',full:'Maximum 20 projects. Export a copy to keep it.',copied:' — copy',compose:'Compose the description',apply:'Apply these choices',undo:'Undo',replace:'Replaces the current description; sections stay intact.',genre:'Music style',mood:'Mood',texture:'Sound texture',speed:'Pace',genres:['Funk','Soul','Jazz','Rock','Electronic','Ambient'],moods:['Joyful','Mysterious','Relaxed','Epic'],textures:['Vintage warmth','Clean and modern','Natural acoustic'],speeds:['Gentle','Upbeat','High energy'],instruments:['Bass','Guitar','Piano','Brass','Synths','Drums'],voice:'Description asks for a voice while Lyrics is instrumental.',loop:'Description asks for a big finish but a section is set to loop.',ending:'An ending is followed by more sections: check the arrangement.',same:'This version matches the selected project.',different:'Comparison: ',style:'different description',blocks:'different arrangement',exported:'Project file prepared.',imported:'Project imported. Save it to keep it here.'},
      es:{projects:'Mis proyectos',name:'Nombre del proyecto',save:'Guardar',duplicate:'Duplicar',open:'Abrir',compare:'Comparar',export:'Exportar proyecto',import:'Importar proyecto',empty:'No hay proyectos guardados',saved:'Proyecto guardado en este navegador.',session:'Almacenamiento no disponible: proyecto guardado en esta sesión. Expórtalo para conservarlo.',note:'Guardado local en este navegador. Exporta un archivo para cambiar de dispositivo.',opened:'Proyecto abierto.',bad:'Archivo no reconocido o demasiado grande. El proyecto actual no cambia.',full:'Máximo 20 proyectos. Exporta una copia para conservarla.',copied:' — copia',compose:'Componer la descripción',apply:'Aplicar estos ajustes',undo:'Deshacer',replace:'Reemplaza la descripción actual; las secciones no cambian.',genre:'Estilo musical',mood:'Ambiente',texture:'Textura',speed:'Ritmo',genres:['Funk','Soul','Jazz','Rock','Electrónica','Ambiental'],moods:['Alegre','Misterioso','Relajado','Épico'],textures:['Calidez vintage','Claro y moderno','Acústico natural'],speeds:['Tranquilo','Animado','Muy enérgico'],instruments:['Bajo','Guitarra','Piano','Metales','Sintes','Batería'],voice:'La descripción pide voz pero Lyrics es instrumental.',loop:'La descripción pide un gran final pero una sección vuelve al inicio.',ending:'Hay secciones después del final: revisa la estructura.',same:'Esta versión coincide con el proyecto seleccionado.',different:'Comparación: ',style:'descripción diferente',blocks:'estructura diferente',exported:'Archivo de proyecto preparado.',imported:'Proyecto importado. Guárdalo para conservarlo aquí.'}
    };
    Object.assign(I18N.fr,{choose:'Choisir un projet'});Object.assign(I18N.en,{choose:'Choose a project'});Object.assign(I18N.es,{choose:'Elegir un proyecto'});
    const ids={genre:['funk','soul','jazz','rock','electronic','ambient'],mood:['joyful','mysterious','relaxed','epic'],texture:['vintage','modern','acoustic'],speed:['gentle','upbeat','high']};
    const sounds=['bass','guitar','piano','brass','synth','drums'];
    let choices={genre:'funk',mood:'joyful',texture:'modern',speed:'upbeat',instruments:['bass','guitar','drums']},undo=null,currentId=null,library=[];
    const key='suno-architect-projects-v1',t=()=>I18N[q('language').value]||I18N.fr;
    const cleanState=s=>({schema:2,locale:s.locale,style:s.style,blocks:s.blocks.map(({type,energy,length,lead,ending})=>({type,energy,length,lead,ending}))});
    const validChoices=c=>c&&Object.entries(ids).every(([k,v])=>v.includes(c[k]))&&Array.isArray(c.instruments)&&c.instruments.length<=6&&c.instruments.every(v=>sounds.includes(v));
    const validProject=p=>p&&p.format==='suno-architect-project'&&p.version===1&&typeof p.name==='string'&&p.name.length<=80&&p.state?.schema===2&&api.valid(p.state)&&(!p.composer||validChoices(p.composer));
    try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data)&&data.length<=20)library=data.filter(p=>validProject(p)&&typeof p.id==='string'&&p.id.length<=80);}catch{}
    function persist(){try{localStorage.setItem(key,JSON.stringify(library));return true;}catch{return false;}}
    function status(s){q('project-status').textContent=s;}
    function project(){return{format:'suno-architect-project',version:1,name:q('project-name').value.trim().slice(0,80)||'Untitled',state:cleanState(api.snapshot()),composer:JSON.parse(JSON.stringify(choices))};}
    function store(duplicate=false){const item=project();if(!currentId||duplicate){if(library.length>=20){status(t().full);return;}currentId=globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(16).slice(2);if(duplicate)item.name=(item.name+t().copied).slice(0,80);}item.id=currentId;const i=library.findIndex(p=>p.id===currentId);if(i>=0)library[i]=item;else library.push(item);q('project-name').value=item.name;const saved=persist();render();q('project-list').value=currentId;status(saved?t().saved:t().session);}
    function adopt(p){if(!validProject(p))return false;api.load(cleanState(p.state));q('project-name').value=p.name;if(p.composer)choices=JSON.parse(JSON.stringify(p.composer));undo=null;render();return true;}
    function composed(){const genre={funk:'funk',soul:'soul',jazz:'jazz',rock:'rock',electronic:'electronic',ambient:'ambient'}[choices.genre];const mood={joyful:'joyful and warm',mysterious:'mysterious and quietly tense',relaxed:'relaxed and spacious',epic:'epic and expansive'}[choices.mood];const texture={vintage:'Warm vintage analog production',modern:'Clean modern production',acoustic:'Natural acoustic textures'}[choices.texture];const speed={gentle:'gentle unhurried pulse',upbeat:'buoyant danceable pulse',high:'driving high-energy pulse'}[choices.speed];return 'Instrumental '+genre+', '+mood+', '+speed+'. '+(choices.instruments.length?'Featured sounds: '+choices.instruments.join(', ')+'. ':'')+texture+'. A memorable motif with room for contrast. No vocals, speech or choir.';}
    function writeStyle(value){q('style').value=value;q('style').dispatchEvent(new Event('input',{bubbles:true}));}
    function warnings(){const s=api.snapshot();const text=s.style.replace(/(?:no|without|sans|sin)\s+(?:(?:female|male|lead)\s+)?(?:vocals?|voices?|voix|chant|voz|voces|singer)(?:,\s*speech\s*or\s*choir)?/gi,'').replace(/(?:no|without|sans|sin)\s+(?:final hit|grand final|big finish)/gi,'');const list=[];if(/\b(vocals?|singer|chanteur|chanteuse|chantée|voz|canto)\b/i.test(text))list.push(t().voice);if(s.blocks.some(b=>b.type==='outro'&&b.ending==='loop')&&/big finish|final hit|grand final|dramatic ending|cierre explosivo/i.test(text))list.push(t().loop);if(s.blocks.slice(0,-1).some(b=>b.type==='outro'))list.push(t().ending);q('warnings').replaceChildren();for(const warning of list){const li=document.createElement('li');li.textContent=warning;q('warnings').append(li);}q('warnings').hidden=!list.length;}
    function render(){const c=t();for(const [id,word]of Object.entries({'project-title':'projects','project-save':'save','project-duplicate':'duplicate','project-open':'open','project-compare':'compare','project-export':'export','project-import':'import','compose-title':'compose','compose-apply':'apply','compose-undo':'undo','compose-note':'replace','storage-note':'note'}))q(id).textContent=c[word];q('project-name').setAttribute('aria-label',c.name);q('project-list').setAttribute('aria-label',c.projects);q('compose-undo').hidden=undo===null;
      const selected=q('project-list').value;q('project-list').replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent=library.length?c.choose:c.empty;empty.disabled=library.length>0;q('project-list').append(empty);library.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;q('project-list').append(o);});q('project-list').value=library.some(p=>p.id===selected)?selected:(currentId||'');q('project-open').disabled=q('project-compare').disabled=!q('project-list').value;
      q('compose-controls').replaceChildren();for(const field of Object.keys(ids)){const label=document.createElement('label');label.textContent=c[field];const select=document.createElement('select');select.dataset.compose=field;const labels=c[field==='genre'?'genres':field==='mood'?'moods':field==='texture'?'textures':'speeds'];ids[field].forEach((v,i)=>{const o=document.createElement('option');o.value=v;o.textContent=labels[i];select.append(o);});select.value=choices[field];select.onchange=()=>{choices[field]=select.value;};label.append(select);q('compose-controls').append(label);}
      q('instruments').replaceChildren();sounds.forEach((sound,i)=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.textContent=c.instruments[i];b.dataset.instrument=sound;b.setAttribute('aria-pressed',String(choices.instruments.includes(sound)));b.onclick=()=>{choices.instruments=choices.instruments.includes(sound)?choices.instruments.filter(x=>x!==sound):[...choices.instruments,sound];b.setAttribute('aria-pressed',String(choices.instruments.includes(sound)));};q('instruments').append(b);});warnings();}
    q('project-save').onclick=()=>store();q('project-duplicate').onclick=()=>store(true);
    q('project-list').onchange=()=>{q('project-open').disabled=q('project-compare').disabled=!q('project-list').value;};
    q('project-open').onclick=()=>{const p=library.find(p=>p.id===q('project-list').value);if(p&&adopt(p)){currentId=p.id;render();q('project-list').value=currentId;status(t().opened);}};
    q('project-compare').onclick=()=>{const p=library.find(p=>p.id===q('project-list').value);if(!p)return;const now=cleanState(api.snapshot()),diff=[];if(now.style!==p.state.style)diff.push(t().style);if(JSON.stringify(now.blocks)!==JSON.stringify(p.state.blocks))diff.push(t().blocks);status(diff.length?t().different+diff.join(' · '):t().same);};
    q('compose-apply').onclick=()=>{undo=q('style').value;writeStyle(composed());q('compose-undo').hidden=false;};q('compose-undo').onclick=()=>{if(undo!==null){writeStyle(undo);undo=null;q('compose-undo').hidden=true;}};
    q('project-export').onclick=()=>{const p=project();if(!validProject(p)){status(t().bad);return;}const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(p.name.replace(/[^a-z0-9_-]/gi,'-').slice(0,60)||'suno-project')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status(t().exported);};
    q('project-import').onclick=()=>q('project-file').click();q('project-file').onchange=async()=>{const file=q('project-file').files[0];try{if(!file||file.size>65536)throw Error('size');const p=JSON.parse(await file.text());if(!validProject(p))throw Error('format');adopt(p);currentId=null;status(t().imported);}catch{status(t().bad);}finally{q('project-file').value='';}};
    q('project-name').value=({fr:'Mon morceau',en:'My track',es:'Mi tema'})[q('language').value];q('language').addEventListener('change',render);root.addEventListener('arranger:change',warnings);window.addEventListener('openai:set_globals',()=>{warnings();});render();
  })();
